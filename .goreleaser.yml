version: 2

project_name: vigil

before:
  hooks:
    # go.mod/go.sum are checked by CI (go mod tidy -diff); never rewrite them at build time.
    - go mod verify
    # Writes THIRD_PARTY_NOTICES (licenses of the Go modules and npm packages we ship);
    # needs the frontend dependencies installed. Fails on a forbidden/unknown license.
    - sh supplemental/scripts/third-party-notices.sh

builds:
  - id: vigil
    binary: vigil
    main: internal/cmd/hub/hub.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/Gu1llaum-3/vigil.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7
    ignore:
      - goos: darwin
        goarch: arm
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: arm64

  - id: vigil-agent
    binary: vigil-agent
    main: internal/cmd/agent/agent.go
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/Gu1llaum-3/vigil.Version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - 7

archives:
  - id: vigil-agent
    formats: [tar.gz]
    ids:
      - vigil-agent
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES
    format_overrides:
      - goos: windows
        formats: [zip]

  - id: vigil
    formats: [tar.gz]
    ids:
      - vigil
    name_template: >-
      {{ .Binary }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: vigil-agent
    package_name: vigil-agent
    description: |-
      Agent for Vigil
      Vigil is a hub/agent patch audit application built on PocketBase.
    maintainer: Gu1llaum-3 <guillaume.archambault@easyparapharmacie.com>
    section: net
    ids:
      - vigil-agent
    formats:
      - deb
    contents:
      - src: ./supplemental/debian/vigil-agent.service
        dst: lib/systemd/system/vigil-agent.service
        packager: deb
      - src: ./supplemental/debian/copyright
        dst: usr/share/doc/vigil-agent/copyright
        packager: deb
      - src: ./THIRD_PARTY_NOTICES
        dst: usr/share/doc/vigil-agent/THIRD_PARTY_NOTICES
        packager: deb
      - src: ./supplemental/debian/lintian-overrides
        dst: usr/share/lintian/overrides/vigil-agent
        packager: deb
    scripts:
      postinstall: ./supplemental/debian/postinstall.sh
      preremove: ./supplemental/debian/prerm.sh
      postremove: ./supplemental/debian/postrm.sh
    deb:
      predepends:
        - adduser
        - debconf
      scripts:
        templates: ./supplemental/debian/templates
        config: ./supplemental/debian/config.sh

checksum:
  # hash (and so sign) the standalone copy attached to the release too
  extra_files:
    - glob: ./THIRD_PARTY_NOTICES

release:
  # also attached on its own: the hub image build downloads it from the release
  extra_files:
    - glob: ./THIRD_PARTY_NOTICES
  prerelease: auto
  make_latest: true
  draft: false
  replace_existing_artifacts: true

# Keyless (OIDC) signing of the checksums file with cosign. The release workflow
# installs cosign and runs with `id-token: write`, so no private key is needed.
# Cosign v3 writes a single Sigstore bundle (signature + certificate + transparency log
# proof) instead of separate .sig/.pem files; releases up to v0.2.14-beta still ship those.
# Verify with (cosign v3):
#   cosign verify-blob --bundle vigil_<ver>_checksums.txt.sigstore.json \
#     --certificate-identity-regexp 'https://github.com/Gu1llaum-3/vigil/.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     vigil_<ver>_checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    output: true
    signature: '${artifact}.sigstore.json'
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - '--yes'

changelog:
  disable: true
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
